<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <title>
      {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}
    </title>
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ "/" | relURL }}">Home</a>
          <a href="{{ "/about/" | relURL }}">About</a>
          <a href="{{ "/projects/" | relURL }}">Projects</a>
          <a href="{{ "/contact/" | relURL }}">Contact</a>
        </nav>
      </div>
    </header>

    {{ block "main" . }}{{ end }}

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© {{ now.Format "2006" }} {{ .Site.Title }}</p>
        <div class="footer-links">
          <a href="{{ .Site.Params.github }}" target="_blank" rel="noreferrer">GitHub</a>
          <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
      </div>
    </footer>
  </body>
</html>
